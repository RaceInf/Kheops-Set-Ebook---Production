<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Fond noir charbon profond -->
  <rect width="64" height="64" fill="#090909" rx="8" />
  
  <!-- Cadre technique fin or -->
  <rect x="3" y="3" width="58" height="58" stroke="#EEB149" stroke-width="1.5" stroke-opacity="0.8" rx="5" />
  
  <!-- Repères d'angle architecturaux -->
  <line x1="3" y1="12" x2="12" y2="3" stroke="#EEB149" stroke-width="1.5" />
  <line x1="52" y1="3" x2="61" y2="12" stroke="#EEB149" stroke-width="1.5" />
  <line x1="3" y1="52" x2="12" y2="61" stroke="#EEB149" stroke-width="1.5" />
  <line x1="52" y1="61" x2="61" y2="52" stroke="#EEB149" stroke-width="1.5" />

  <!-- Monogramme architectural Kheops Set : K géométrique d'acier et d'or -->
  <!-- Mât vertical (Acier / Blanc pur) -->
  <rect x="18" y="16" width="6" height="32" fill="#FFFFFF" />
  
  <!-- Éléments obliques (Or discret) -->
  <path d="M42 16L27 30L44 48H35L22 34V30L34 16H42Z" fill="#EEB149" />
  
  <!-- Point de visée technique central -->
  <circle cx="21" cy="32" r="1.5" fill="#090909" />
</svg>
